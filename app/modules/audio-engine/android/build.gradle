apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.audioengine'
version = '0.1.0'

def modelsDir = file('../../../models')
def bundleName = providers.gradleProperty('diarizationOnly').orNull == 'true' ? 'diarization' : 'full'
def bundleDir = new File(modelsDir, "bundles/${bundleName}")
def sherpaAar = new File(modelsDir, 'downloads/sherpa-onnx-2.0.1.aar')

android {
  namespace 'expo.modules.audioengine'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
  sourceSets.main.assets.srcDir(bundleDir)
}

dependencies {
  implementation files(sherpaAar)
}

tasks.named('preBuild') {
  doFirst {
    if (!sherpaAar.isFile() || !new File(bundleDir, 'models/manifest.json').isFile()) {
      def command = bundleName == 'diarization' ? 'npm run models:android -- --diarization-only' : 'npm run models:android'
      throw new GradleException("Android model bundle is missing. From app/, run: ${command}")
    }
  }
}
