apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
group = 'expo.modules.audioengine'
version = '0.1.0'
def sherpaAar = file('../../../models/downloads/sherpa-onnx-2.0.1.aar')
android {
  namespace 'expo.modules.audioengine'
  defaultConfig { versionCode 1; versionName '0.1.0'; consumerProguardFiles 'consumer-rules.pro' }
}
dependencies {
  implementation files(sherpaAar)
  // Java API for running pyannote segmentation directly (FastSegmenter). Must stay on the same ORT
  // line as the libonnxruntime.so inside the sherpa-onnx AAR (1.28.x); see withOnnxRuntimePackaging.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
}
tasks.matching { it.name == 'preBuild' }.configureEach {
  doFirst {
    if (!sherpaAar.isFile()) throw new GradleException('Run npm run models:android from app/: sherpa AAR is missing.')
    if (providers.gradleProperty('diarizationOnly').orNull == 'true') throw new GradleException('Diagnostic-only APK is not a submission build. Use the full bundle.')
  }
}
// Checking APKs must contain the complete offline bundle, even when Gradle is called directly.
def verifyBundledModels = tasks.register('verifyBundledModels') {
  doLast {
    def root = file('src/main/assets/models')
    def manifestFile = new File(root, 'manifest.json')
    if (!manifestFile.isFile()) throw new GradleException('Built-in models missing. Run npm run models:pack from app/. See docs/model-bundle.md.')
    def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
    def required = ['asr', 'tokens', 'segmentation', 'embedding', 'llm'] as Set
    if (manifest.version != 1 || manifest.language != 'ru' || !(manifest.files instanceof List) || manifest.files.size() != 5 || (manifest.files.collect { it.id } as Set) != required) {
      throw new GradleException('Invalid or incomplete built-in model manifest')
    }
    if ((manifest.files.collect { it.file } as Set).size() != 5) throw new GradleException('Duplicate built-in model file')
    manifest.files.each { entry ->
      if (!(entry.file instanceof String) || !(entry.file ==~ /[a-zA-Z0-9_.-]+/) || entry.file in ['.', '..']) throw new GradleException('Invalid model path')
      def model = new File(root, entry.file)
      if (!model.isFile() || entry.size <= 0 || model.length() != entry.size) throw new GradleException("Built-in model missing or incomplete: ${entry.id}")
      def digest = java.security.MessageDigest.getInstance('SHA-256')
      model.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
      }
      if (digest.digest().encodeHex().toString() != entry.sha256) throw new GradleException("Built-in model checksum mismatch: ${entry.id}")
    }
  }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn(verifyBundledModels) }
