def route = { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
        def original = repo.url.toString()
        def prefix = null
        if (original.startsWith('https://dl.google.com') || original.startsWith('https://maven.google.com')) prefix = 'google'
        else if (original.startsWith('https://repo.maven.apache.org') || original.startsWith('https://repo1.maven.org')) prefix = 'central'
        else if (original.startsWith('https://plugins.gradle.org')) prefix = 'plugins'
        if (prefix != null) { repo.url = uri('http://127.0.0.1:8766/' + prefix + '/'); repo.allowInsecureProtocol = true }
    }
}
gradle.settingsEvaluated { settings -> settings.pluginManagement.repositories.configureEach(route) }
gradle.beforeProject { project ->
    project.buildscript.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { dependency ->
            if (dependency.requested.group == 'com.android.tools.build' && dependency.requested.name == 'gradle') dependency.useVersion('9.2.1')
        }
    }
    project.buildscript.repositories.configureEach(route)
    project.repositories.configureEach(route)
}
