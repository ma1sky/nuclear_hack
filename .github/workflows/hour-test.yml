name: Hour test (AMI IN1016)

# One real annotated hour (AMI IN1016, CC BY 4.0, prepared by tools/benchmark/prepare_hour_case.py):
#  - der: DER of this version's diarization vs v1.2 on the whole hour (Python twins of the Kotlin code)
#  - ui:  the release APK on an Android emulator, imported through the system file picker (run_hour_ui.py)
on:
  push:
    branches: ['123123']
    paths: ['.github/workflows/hour-test.yml', 'tools/benchmark/**']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag with the APK (empty = the build of the latest app/ commit)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  der:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Python dependencies
        run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet sherpa-onnx==2.0.1 onnxruntime numpy scipy soundfile

      - name: AMI hour and manual reference
        run: python3 tools/benchmark/prepare_hour_case.py --output /tmp/hour

      - name: Models (SHA-256 verified)
        run: |
          mkdir -p /tmp/m && cd /tmp/m
          R=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -sSfL $R/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2 | tar xj
          cp sherpa-onnx-pyannote-segmentation-3-0/model.int8.onnx pyannote-segmentation.int8.onnx
          curl -sSfL -o campplus-zh-en.onnx $R/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
          curl -sSfL -o eres2net-base.onnx $R/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
          printf '%s  %s\n' aa3cfc16963a10586a9393f5035d6d6b57e98d358b347f80c2a30bf4f00ceba2 campplus-zh-en.onnx \
            1a331345f04805badbb495c775a6ddffcdd1a732567d5ec8b3d5749e3c7a5e4b eres2net-base.onnx | sha256sum -c -

      - name: DER on the hour (this version vs v1.2)
        working-directory: tools/benchmark
        run: /tmp/venv/bin/python der_fast.py --audio /tmp/hour/hour-ami-IN1016.wav --rttm /tmp/hour/hour-ami-IN1016.rttm --models /tmp/m --threads 4 --out /tmp/der-hour.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: der-hour
          path: /tmp/der-hour.json

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Download the APK (waits for the Build APK run of the latest app/ commit)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          APP_SHA=$(git log -1 --format=%H -- app)
          for i in $(seq 1 90); do
            [ -n "$TAG" ] && break
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq "[.[] | select(.target_commitish == \"$APP_SHA\")][0].tag_name // empty")
            [ -n "$TAG" ] && break
            echo "waiting for the APK of $APP_SHA ($i)"; sleep 60
          done
          [ -n "$TAG" ] || { echo "no release for $APP_SHA"; exit 1; }
          echo "APK from $TAG"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name|endswith(".apk")) | .id' | head -1)
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ID" > /tmp/app.apk
          ls -la /tmp/app.apk

      - name: AMI hour
        run: python3 tools/benchmark/prepare_hour_case.py --output /tmp/hour

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Hour through the real UI on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8G
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -noaudio
          disable-animations: true
          script: |
            adb install -r -g /tmp/app.apk
            python3 tools/benchmark/run_hour_ui.py --serial emulator-5554 --label ci --timeout 5400 --adb adb --audio-dir /tmp/hour || true

      - name: Result
        if: always()
        run: |
          R=artifacts/test-results/hour-ami-2026-11-08/ci/result.json
          [ -f $R ] && python3 -c "import json;r=json.load(open('$R'));print(json.dumps({k:v for k,v in r.items() if k!='stages'},ensure_ascii=False,indent=1));[print(s['elapsed_s'],s['stage']) for s in r.get('stages',[])]"
          grep -E "AndroidRuntime|FATAL|OutOfMemory|SpeakerDiarizer|onnxruntime" artifacts/test-results/hour-ami-2026-11-08/ci/logcat.log | tail -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hour-ui
          path: artifacts/test-results/hour-ami-2026-11-08/ci/
